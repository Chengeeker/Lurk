name: lurk
description: "An Android client for Baidu Tieba."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 2.6.3+51

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dynamic_color: ^1.7.0
  extended_image: ^8.2.1
  easy_refresh: ^3.4.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.4
  package_info_plus: ^8.3.0
  intl: ^0.20.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  crypto: ^3.0.6
  flutter_displaymode: ^0.6.0
  video_player: ^2.9.2
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  liquid_glass_widgets: ^1.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/gallery_glass_button.frag
  assets:
    - assets/icons/
